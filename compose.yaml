# Local run and the simplest self-host: Postgres + the blog.
#   docker compose up --build
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog-local-only}
      POSTGRES_DB: blog
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog"]
      interval: 5s
      timeout: 5s
      retries: 20

  blog:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://blog:${POSTGRES_PASSWORD:-blog-local-only}@postgres:5432/blog
      Blog__PublicUrl: ${BLOG_PUBLIC_URL:-http://localhost:8080}
      Blog__SetupToken: ${BLOG_SETUP_TOKEN:-}
      # /demo: visitors try the app as a guest on a hidden sample blog, every change refused (docs/specs/demo.md).
      Blog__Demo__Enabled: ${BLOG_DEMO_ENABLED:-false}
      Blog__Auth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Blog__Auth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Blog__Auth__Discord__ClientId: ${DISCORD_CLIENT_ID:-}
      Blog__Auth__Discord__ClientSecret: ${DISCORD_CLIENT_SECRET:-}
      # Seals stored credentials (notifications, Cloudflare, social accounts): openssl rand -hex 32. Keep a copy.
      Blog__Secrets__MasterKey: ${BLOG_SECRETS_MASTER_KEY:-}
      Blog__Secrets__PreviousKeys: ${BLOG_SECRETS_PREVIOUS_KEYS:-}
      # Pictures: an S3-compatible bucket (Cloudflare R2: region auto, url_style path). Empty: pictures are off.
      Blog__Bucket__endpoint: ${BUCKET_ENDPOINT:-}
      Blog__Bucket__name: ${BUCKET_NAME:-}
      Blog__Bucket__access_key: ${BUCKET_ACCESS_KEY:-}
      Blog__Bucket__secret_key: ${BUCKET_SECRET_KEY:-}
      Blog__Bucket__region: ${BUCKET_REGION:-auto}
      Blog__Bucket__url_style: ${BUCKET_URL_STYLE:-path}
    ports:
      - "8080:8080"

volumes:
  pgdata:
